analyze_metrics:
  description: >
    Perform quantitative analysis on the collected stock data for {stock_symbols}:
    - Calculate financial ratios (P/E, P/B, debt-to-equity, etc.)
    - Compute technical indicators (RSI, MACD, moving averages)
    - Analyze price trends and volatility
    - Assess valuation metrics
    - Generate quantitative scores and ratings
  expected_output: >
    A comprehensive quantitative analysis report with calculated metrics,
    technical indicators, valuation assessments, and numerical scores
    for each stock symbol.
  agent: quant_analyst
