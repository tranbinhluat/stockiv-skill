summarize_market:
  description: >
    Analyze the overall macro market sentiment by reading the provided
    market context file. Identify broad economic trends, sector rotations,
    and general market psychology that could impact the investment landscape.
    Use your tools to read the file located at: {macro_context_file}
  expected_output: >
    A Macro Market Report formatted strictly as follows:
    - **I. Executive Summary:** A brief 2-3 sentence summary of the dominant market mood (risk-on/risk-off, bullish/bearish) and its primary systemic drivers today.
    - **Market Dashboard:** A concise markdown table or list of key data points (e.g., VN-Index closing price, WoW change, VIX level, USD/VND rate).
    - **II. Key Market Sentiment Indicators:** Use BLUF (Bottom Line Up Front) format. For each bullet, bold the keyword, state the status in 1-2 words, then provide a single sentence of context (e.g., "**Breadth**: Positive. Manufacturing output prices hit a 45-month peak, driving growth...").
    - **III. Sectoral Sentiment Analysis:** Use BLUF format for sector rotations, leaders, and laggards based on daily news flow.
    - **IV. Upcoming Macro Catalysts:** A markdown table with columns for `Timeframe`, `Event`, and `Expected Impact (High/Med/Low)`.
    **(CITATION REQUIREMENT: Every factual claim MUST be cited using a footnote system `[^1]`. At the very bottom of the document, you MUST include a "References" section. CRITICAL: ONLY include sources in the References section that were explicitly cited in the text above. DO NOT list all sources from the context. Each footnote in the References must correspond to a clickable markdown link containing the actual source URL. Format: `[^1]: [Article Title](URL)`.)**
  output_file: data/processed/sentiment/market/{date}_market_sentiment.md
  agent: sentiment_analyst

summarize_symbol:
  description: >
    Analyze the sentiment specific to {stock_symbols} by reviewing its
    dedicated ticker context file. Evaluate recent news, localized events,
    and management actions to determine how they affect the stock's outlook.
    Use your tools to read the file located at: {ticker_context_file}
  expected_output: >
    A Specific Ticker Report formatted strictly as follows:
    - **I. Stock Sentiment Snapshot:** A brief 2-3 sentence summary of the overall mood (Bullish/Bearish/Neutral) specific to {stock_symbols}.
    - **Ticker Dashboard:** A concise markdown table or list of key data points.
    - **II. Event-Driven Catalysts:** A markdown table with columns for `Timeframe` (or Date), `Event`, and `Expected Impact (High/Med/Low)`.
    - **III. Aspect-Based Findings:** Use BLUF (Bottom Line Up Front) format. For each bullet, bold the aspect, state the status in 1-2 words, then provide a single sentence of context.
    - **IV. Institutional vs. Retail Perspectives:** A brief 2-3 sentence comparison contrasting professional analyst sentiment vs public/social momentum.
    **(CITATION REQUIREMENT: Every factual claim MUST be cited using a footnote system `[^1]`. At the very bottom of the document, you MUST include a "References" section. CRITICAL: ONLY include sources in the References section that were explicitly cited in the text above. DO NOT list all sources from the context. Each footnote in the References must correspond to a clickable markdown link containing the actual source URL. Format: `[^1]: [Article Title](URL)`.)**
  output_file: data/processed/sentiment/ticker/{date}_{stock_symbols}_ticker_sentiment.md
  agent: sentiment_analyst
