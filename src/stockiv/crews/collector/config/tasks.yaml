fetch_financials_task:
  description: >
    Retrieve 10-year financial statements and historical ratios for {stock_symbols}.

    You must use the provided tools to fetch this quarterly/annual tabular data
    and store it directly into the local SQLite database.
    Remember to check if the most recent quarter's data already exists in the
    database to avoid unnecessary API calls.
  expected_output: >
    A confirmation message that the financial data for the requested tickers
    has been successfully saved to the SQLite database.
  agent: market_data_fetcher

fetch_daily_market_data_task:
  description: >
    Retrieve the latest daily trading data, company overview (size/industry),
    current P/E, P/B, and live market metrics for {stock_symbols}.

    This data is highly time-sensitive. Use the provided tools (including
    fetch_company_overview and fetch_ratio_summary) to hit the API
    directly and update the local SQLite database with today's values.
  expected_output: >
    A confirmation message that today's market metrics for the requested tickers
    have been successfully updated in the SQLite database.
  agent: market_data_fetcher

fetch_market_context_task:
  description: >
    Gather comprehensive macro and micro market context for {stock_symbols}.

    Use your search tools to find recent news, industry trends, and global
    macroeconomic factors affecting these tickers and their sectors.
    Be extremely selective with your search queries to conserve API limits.
    Construct 1-2 highly effective composite queries rather than many simple ones.
  expected_output: >
    A detailed Markdown or JSON report summarizing the key news, macro trends,
    and market context for the requested tickers, ready to be consumed by the
    Sentiment Crew.
  agent: macro_micro_scout
