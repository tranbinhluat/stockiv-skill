fetch_financials_task:
  description: >
    DELEGATE this ENTIRE task to `market_data_fetcher` (Quantitative Market Data Specialist).
    Do NOT delegate any part of this task to `macro_micro_scout` or `annual_report_analyst`.

    `market_data_fetcher` must follow these exact steps for {stock_symbols}:
    1. Use `fetch_historical_prices` with `days_back=30` to get only the LAST 30 DAYS of price data. Do NOT fetch more than 30 days — only recent momentum data is needed.
    2. Use `fetch_financial_statements` to retrieve the Income Statement, Balance Sheet, and Cashflow data in year/quarter period (10 years of yearly + recent quarterly).
    3. Use `fetch_financial_ratios` to record the historical fundamental ratios.
    4. Use `fetch_dividend_history` to pull the dividend payout record.

    `market_data_fetcher` should check if the data already exists in the database to avoid unnecessary API calls.
  expected_output: >
    A confirmation message that the financial data (30 days of prices, 10 years of statements, ratios, dividends)
    for the requested tickers has been successfully saved to the SQLite database.
  max_retries: 5

fetch_daily_market_data_task:
  description: >
    DELEGATE this ENTIRE task to `market_data_fetcher` (Quantitative Market Data Specialist).
    Do NOT delegate any part of this task to `macro_micro_scout` or `annual_report_analyst`.

    CRITICAL: This task guarantees all holistic market data is present for downstream analytics.
    `market_data_fetcher` must follow these exact steps:
    1. Use `fetch_historical_prices` to fetch the real-time `VNINDEX` and store it in the database.
    2. Use `fetch_company_overview` and `fetch_ratio_summary` to update the local SQLite database with today's values for {stock_symbols}.
    3. Identify 1-2 top domestic competitors (peers in the same industry in Vietnam) for {stock_symbols} and execute `fetch_ratio_summary` on those peers so the database is pre-loaded for downstream peer comparisons.

    VERIFICATION: Before finishing, `market_data_fetcher` MUST verify that:
    - VNINDEX price rows exist today.
    - {stock_symbols}'s ratio summary (containing P/E and P/B ratios) has been successfully inserted.
  expected_output: >
    A confirmation message detailing that today's market metrics for VNINDEX, {stock_symbols}, and its top peers have been successfully updated in the SQLite database and verified.
  context: [fetch_financials_task]
  max_retries: 5

crawl_live_ratios_task:
  description: >
    DELEGATE this ENTIRE task to `market_data_fetcher` (Quantitative Market Data Specialist).
    Do NOT delegate any part of this task to `macro_micro_scout` or `annual_report_analyst`.

    Use exactly the `crawl_vietstock_ratios` tool to extract the LIVE market valuation (EPS, PE, Beta, Dividend Yield, Market Capitalization) for {stock_symbols}.
    This guarantees we have up-to-the-minute data if the underlying APIs are stale.
    Also use `crawl_vnindex_ratios` to fetch the current VNINDEX P/E, P/B, and Market Cap from Simplize.vn.
  expected_output: >
    A confirmation string that the live Vietstock ratios for the ticker AND the VNINDEX ratios have been successfully inserted into the SQLite database.
  context: [fetch_daily_market_data_task]
  max_retries: 7

fetch_macro_context_task:
  description: >
    DELEGATE this ENTIRE task to `macro_micro_scout` (Macroeconomic & Market Context Researcher).
    Do NOT delegate any part of this task to `market_data_fetcher` or `annual_report_analyst`.

    `macro_micro_scout` must follow these exact steps:
    1. MUST use the `clean_expired_cache` tool to remove stale context cache files (older than 14 days) so that subsequent searches return fresh live data.
    2. Use `search_market_context` to broadly query current macroeconomic trends (e.g. interest rates, inflation, GDP, WAR, policy, etc) affecting Vietnam and global markets within a week.
    3. Review initial findings and identify the 1-2 most impactful macroeconomic storylines or shock events.
    4. Use `search_market_context` again to drill down specifically into those 1-2 top storylines to build a profound, data-backed understanding.

    CONTEXT: The target stock is {stock_symbols} ({company_name}). Keep this identity in mind when evaluating which macro trends are most relevant.

    CRITICAL: DO NOT SUMMARIZE. PRESERVE THE FULL VIEW of gathered information.
    CRITICAL: Exclude outdated information from previous years unless explicitly analyzing historical context. Focus exclusively on the current week's news and the current year's data. Explicitly append the current year ({current_year}) to search queries to prioritize fresh content.
    CRITICAL: `macro_micro_scout` is allowed to use tools up to 3 times. Keep searches extremely precise.
  expected_output: >
    A comprehensive RAW DATA COMPILATION containing the full text, critical claims,
    snippets, supporting statistics, and URLs for all impactful macroeconomic
    and industry-wide news.
  output_file: "{market_context_path}"
  max_retries: 5

fetch_ticker_context_task:
  description: >
    DELEGATE this ENTIRE task to `macro_micro_scout` (Macroeconomic & Market Context Researcher).
    Do NOT delegate any part of this task to `market_data_fetcher` or `annual_report_analyst`.

    Now that macro context has been gathered, `macro_micro_scout` must shift focus EXCLUSIVELY
    to the {stock_symbols} ({company_name}) ticker. Search for company-specific news, product launches, earnings
    leaks, or management statements.

    CRITICAL IDENTITY: {stock_symbols} is "{company_name}". Always include the full company name in search queries to avoid confusion with other tickers or companies.

    If previous macro research highlighted a specific headwind (e.g. "chip shortage"),
    `macro_micro_scout` should search to see how {stock_symbols} ({company_name}) is reacting to it.

    CRITICAL: `macro_micro_scout` is allowed to use tools up to 3 times. Keep searches extremely precise.
  expected_output: >
    A comprehensive RAW DATA COMPILATION containing the full text, critical claims,
    direct quotes, supporting statistics, and URLs for all impactful ticker-specific news.
    CRITICAL: DO NOT SUMMARIZE. PRESERVE THE FULL VIEW of gathered information.
    CRITICAL: Exclude outdated information from previous years. Focus exclusively on the current week's news and the current year's data. Explicitly append the current year ({current_year}) to search queries.
  output_file: "{ticker_context_path}"
  context: [fetch_macro_context_task]
  max_retries: 5

fetch_annual_report_task:
  description: >
    DELEGATE this ENTIRE task to `annual_report_analyst` (Corporate Archive Retrieval Specialist).
    Do NOT delegate any part of this task to `market_data_fetcher` or `macro_micro_scout`.

    `annual_report_analyst` must follow these steps:
    1. Use `search_annual_report_pdf` with ticker="{stock_symbols}" and year="{annual_report_year}". Do NOT change the year — use exactly "{annual_report_year}".
    2. Once a valid PDF URL is found, use `download_and_convert_pdf` with md_path="{annual_report_md_dir}/{stock_symbols}_annual_report_{annual_report_year}.md" and pdf_dir="{annual_report_pdf_dir}".

    CRITICAL: Do NOT attempt multiple searches. If the download fails or the tool reports an unreadable scanned image, simply report failure.
  expected_output: >
    A confirmation message that the Annual Report PDF has been successfully found, downloaded, and converted to Markdown, including the final file path.
  max_retries: 5
