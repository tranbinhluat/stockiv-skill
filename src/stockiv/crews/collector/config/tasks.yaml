fetch_financials_task:
  description: >
    Retrieve 10-year financial statements and historical ratios for {stock_symbols}.

    You must use the provided tools to fetch this quarterly/annual tabular data
    and store it directly into the local SQLite database.
    Remember to check if the most recent quarter's data already exists in the
    database to avoid unnecessary API calls.
  expected_output: >
    A confirmation message that the financial data for the requested tickers
    has been successfully saved to the SQLite database.
  max_iter: 3

fetch_daily_market_data_task:
  description: >
    Retrieve the latest daily trading data, company overview (size/industry),
    current P/E, P/B, and live market metrics for {stock_symbols}.

    CRITICAL INSTRUCTION: You represent the UPSTREAM DATA AUTHORITY. You MUST guarantee all holistic data is present for downstream analytics.
    1. First, use `fetch_market_index` to fetch the real-time `VNINDEX` and store it in the database.
    2. Second, hit the API directly using `fetch_company_overview` and `fetch_ratio_summary` to update the local SQLite database with today's values for {stock_symbols}.
    3. Third, identify 1-2 top domestic competitors (peers in the same industry in Vietnam) for {stock_symbols} and execute `fetch_ratio_summary` on those peers so the database is pre-loaded for downstream peer comparisons.

    VERIFICATION PROTOCOL: Before finishing this task, you MUST independently query the `data/stockiv.db` (if you possess a database reading tool) OR verify your raw output logs to absolutely confirm that:
    - VNINDEX price rows exist today.
    - {stock_symbols}'s ratio summary (which contains the P/E and P/B ratios) has been successfully inserted.
  expected_output: >
    A confirmation message detailing that today's market metrics for VNINDEX, {stock_symbols}, and its top peers have been successfully updated in the SQLite database and verified.
  context: [fetch_financials_task]
  max_iter: 5

fetch_macro_context_task:
  description: >
    Gather overarching global macroeconomic conditions, Vietnam domestic economy health,
    and broad sector/industry trends.

    CRITICAL INSTRUCTION: You MUST NOT search for the specific ticket.
    Your entire focus must be on the macro-environment, interest rates, industry trends,
    and global supply chains.

    Do not just scrape the surface. After your first search, identify the
    most impactful 1-2 macro storylines and use additional tool calls to search specifically
    into those sub-topics to build a profound understanding.
  expected_output: >
    A comprehensive RAW DATA COMPILATION containing the full text, critical claims,
    direct quotes, supporting statistics, and URLs for all impactful macroeconomic
    and industry-wide news.
    CRITICAL: DO NOT SUMMARIZE. YOU MUST PRESERVE THE FULL VIEW of the information you found.
  output_file: "{market_context_path}"
  max_iter: 3

fetch_ticker_context_task:
  description: >
    Gather specific news, management interviews, and localized events explicitly
    for the {stock_symbols} ticker.

    Now that you understand the macro environment, your focus shifts EXCLUSIVELY to
    the specific ticket. Search for company-specific news, product launches, earnings
    leaks, or management statements.

    If your previous macro research highlighted a specific headwind (e.g. "chip shortage"),
    you should search to see how the specific ticket ({stock_symbols}) is reacting to it.
  expected_output: >
    A comprehensive RAW DATA COMPILATION containing the full text, critical claims,
    direct quotes, supporting statistics, and URLs for all impactful ticker-specific news.
    CRITICAL: DO NOT SUMMARIZE. YOU MUST PRESERVE THE FULL VIEW of the information you found.
  output_file: "{ticker_context_path}"
  context: [fetch_macro_context_task]
  max_iter: 3

fetch_annual_report_task:
  description: >
    Find and download the most recent Annual Report (Báo cáo thường niên) PDF for {stock_symbols}.

    1. First, calculate the most recent completed financial year (e.g., if today is mid 2026, you should search for the 2025 Annual Report).
    2. Use `search_annual_report_pdf` with the ticker and that calculated year. Look for direct URLs ending in `.pdf`.
    3. Once you find a valid PDF URL, use `download_and_convert_pdf` to download and translate it into a local Markdown file. You MUST explicitly provide `md_path="{annual_report_md_dir}/{stock_symbols}_annual_report_<YEAR>.md"` (replacing <YEAR> with the calculated year) and `pdf_dir="{annual_report_pdf_dir}"` to the tool.

    CRITICAL: Do NOT attempt multiple searches if the first one fails. You are strictly allowed only 1 search action to preserve API quotas. If the URL doesn't look like a PDF, the download fails, or the tool reports it's an unreadable scanned image, simply report failure.
  expected_output: >
    A confirmation message that the Annual Report PDF has been successfully found, downloaded, and converted to Markdown, including the final file path (e.g. data/processed/annual_reports/FPT_annual_report_2025.md).
  max_iter: 1
