routing_task:
  description: >
    You are the Master Orchestrator of the StockIV Pipeline.
    Analyze the current state and determine the absolute next step required.

    {request}

    RULES FOR EXTRACTION:
    1. Base Evaluation: Determine if the user is asking to analyze a specific stock/company.
    2. Target Identification: If yes, extract the uppercase ticker symbol for that company (e.g. FPT, VNM, AAPL).
    3. Output Format: If valid, set is_valid to True and output the ticker. If it's a conversational or unrelated request, set is_valid to False and leave target_ticker empty.

  expected_output: >
    A structured extraction decision indicating if the request is valid and the target ticker if applicable.
  agent: router
