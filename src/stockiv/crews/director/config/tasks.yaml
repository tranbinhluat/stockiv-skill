validate_analysis:
  description: >
    Perform forensic review and validation of the stock analysis for {stock_symbols}.

    **STEP 0 — SYNTHESIS REPORT (PRE-LOADED)**
    The synthesis report for {stock_symbols} is located at `{synthesis_report_path}`.
    Its full content is provided below. If it says "ERROR:" or is empty, set decision = "MORE_INFO_NEEDED" with the error details.

    --- BEGIN SYNTHESIS REPORT ---
    {report_content}
    --- END SYNTHESIS REPORT ---

    **STEP 0.5 — FINANCIAL GROUND TRUTH (PRE-LOADED)**
    The financial data (collected directly from vnstock API database) is located at `{financial_summary_path}`.
    Its full content is provided below. Use this as your SOURCE OF TRUTH for cross-checking the Synthesizer's numbers.
    If the Synthesizer's numbers contradict this data, flag it as an accuracy failure.

    --- BEGIN FINANCIAL GROUND TRUTH ---
    {financial_summary_content}
    --- END FINANCIAL GROUND TRUTH ---

    Your Output Format:
    You must output your findings matching the DirectorDecision pydantic model.

    {{
      "decision": "APPROVED" | "REJECTED" | "MORE_INFO_NEEDED",
      "ticker": "stock symbol",
      "style": "Graham | Greenblatt | Lynch | All",
      "financial_data_verified": true/false,
      "methodology_sound": true/false,
      "numbers_accurate": true/false,
      "analysis_complete": true/false,
      "logic_and_reasoning_sound": true/false,
      "evidence_traceable": true/false,
      "anomalies": [
        {{
          "category": "revenue | margins | balance_sheet | cash_flow | equity | related_parties | governance",
          "description": "brief description",
          "data": "specific numbers",
          "question": "probing question",
          "required": "what must be provided"
        }}
      ],
      "failures": ["specific failure 1", "specific failure 2"],
      "feedback_summary": "human-readable summary of decision and key findings",
      "next_steps": ["step 1", "step 2"]
    }}

    **Step 1: Verify Financial Data (→ financial_data_verified)**
    Confirm that the synthesis report has reviewed and cited:
    - Income Statement (3-5 years)
    - Balance Sheet (3-5 years)
    - Cash Flow Statement (3-5 years)

    Set financial_data_verified = false if any are missing or clearly fabricated.

    **Step 2: Scan for Anomalies**
    Check for the following patterns and add to anomalies list:

    *Revenue Anomalies:*
    - Revenue spikes in Q4 (earnings management?)
    - Revenue grows but receivables grow faster (booking sales not collected?)
    - Revenue up, cash from operations down (low quality earnings?)
    - One customer >20% revenue (concentration risk?)

    *Margin Anomalies:*
    - Gross margin jumps unexpectedly (accounting change or one-time gain?)
    - Operating margin declining while revenue grows (cost control failure?)
    - Net margin higher than operating margin (one-time gains?)
    - SG&A growing faster than revenue (bloated overhead?)

    *Balance Sheet Anomalies:*
    - Inventory growing faster than sales (overproduction or obsolescence?)
    - Receivables aging increasing (collection problems?)
    - Goodwill >20% of assets (overpaid for acquisitions?)
    - Off-balance sheet liabilities (hidden debt?)

    *Cash Flow Anomalies:*
    - Net income positive, operating cash flow negative (low quality earnings?)
    - Free cash flow negative for 3+ years (cash burn?)
    - Dividends paid while FCF negative (unsustainable payout?)

    *Related Party & Governance Anomalies:*
    - Related party transactions >5% revenue (self-dealing risk?)
    - Loans to directors/executives (governance red flag?)
    - Qualified audit opinion (auditor concerns?)
    - Accounting policy changes (earnings management?)

    For each anomaly detected, add to anomalies array with all required fields.

    **Step 3: Validate Methodology (→ methodology_sound)**
    Check whether:
    - Correct investment style used (Graham, Greenblatt, Lynch, All)
    - Investment criteria evaluated for the chosen style
    - Industry-specific factors considered

    **Step 4: Validate Accuracy (→ numbers_accurate)**
    Cross-check the Synthesizer's numbers against the Financial Ground Truth:
    - Are key ratios (P/E, P/B, EPS, ROE, ROA) consistent with ground truth?
    - Are calculations (PEG ratio, target price, MoS) mathematically correct?
    - Is data current (not stale)?

    CRITICAL: Use the EXACT values from the Financial Ground Truth to verify.
    For example, if the ground truth shows Lynch PEG = 2.19 and the report claims PEG = 0.43, that is an accuracy failure.

    **Step 5: Validate Completeness (→ analysis_complete)**
    Check whether:
    - Risk factors identified and analyzed
    - Red flags reported if they exist (Note: red flags EXISTING is NOT reason to reject — NOT REPORTING them IS)
    - Downside scenarios considered
    - Key investment criteria for the chosen style addressed

    **Step 5B: Validate Logic & Reasoning (→ logic_and_reasoning_sound)**
    Check whether the analysis conclusions make logical sense given the data:
    - Dissonance check: Does the Actionable Suggestion strictly align with the calculated Valuation? If the Target Price is LOWER than the Current Price, the recommendation CANNOT be "BUY".
    - Growth Assumption Sanity: Are the projected growth rates mathematically grounded in historical reality? Projecting >20% sustained growth for a mature, large-cap, or slow-growth classified company is a red flag and must be challenged unless explicitly justified by a massive catalyst.
    - Multiple Sanity: Is the assigned "Fair P/E" or "Fair P/B" realistic for the sector and the Vietnamese market context? Re-rating a stock to an exceptionally high multiple without peer/historical precedent is illogical.
    - Sentiment check: Was strongly negative sentiment acknowledged and factored into the risk assessment?
    - Classification check: Does the categorization numerically match reality? (e.g. calling a stable 5% grower a "Fast Grower" or a bank a "Slow Grower" is illogical).
    If the logic is twisted or nonsensical, set logic_and_reasoning_sound = false and explain it in failures.

    **Step 6: Validate Evidence (→ evidence_traceable)**
    Check whether claims are traceable to data sources:
    - References to the Financial Summary file or SQLite database
    - Inline citations like [Source: SQLite Database] or [Financial Summary]
    - Annual report references (if applicable)

    ⚠️ IMPORTANT: Our data pipeline uses SQLite database (from vnstock API) and annual report MDX extraction.
    Inline citations referencing database sources are VALID evidence.
    Do NOT require literal Excel files, PDF attachments, or physical documents.
    Transparent step-by-step calculations shown in prose satisfy the evidence requirement.

    **Step 7: Make Decision**

    Set decision based on validation:

    **"APPROVED"** when:
    ✅ financial_data_verified = true
    ✅ anomalies is empty OR all anomalies addressed with evidence
    ✅ methodology_sound = true
    ✅ numbers_accurate = true
    ✅ analysis_complete = true
    ✅ logic_and_reasoning_sound = true
    ✅ evidence_traceable = true

    **"REJECTED"** when:
    ❌ Any of the 6 booleans = false
    ❌ Anomalies detected but not addressed
    ❌ Numbers contradict Financial Ground Truth

    **"MORE_INFO_NEEDED"** when:
    🔄 Some checks incomplete (missing but not failed)
    🔄 Anomalies detected, clarification needed

    Remember: You challenge the ANALYSIS, not the COMPANY. If Synthesizer reports red flags with evidence → APPROVE. If they ignore red flags → REJECT.

    For failures, add specific messages to the failures array.
    Provide feedback_summary as a concise human-readable summary.
    For REJECTED or MORE_INFO_NEEDED, provide next_steps array with specific actionable items.
  expected_output: >
    A well-formatted JSON document containing: decision (APPROVED, REJECTED, MORE_INFO_NEEDED),
    ticker, style, 5 validation booleans, anomalies list, failures list, feedback_summary,
    and optional next_steps. It MUST be valid JSON.
  agent: director
