collect_baseline_metrics:
  description: >
    Create a comprehensive, self-contained financial baseline markdown report for `{stock_symbols}`.

    Step 1: Use `FetchRecentFinancialsTool` for `{stock_symbols}` — extract 3-4 years of data plus the latest quarter.
    Step 2: Use `FetchPeerComparisonsTool` for `{stock_symbols}` — gather VNINDEX baseline and top competitor ratios.
    Step 3: Organize ALL data into readable markdown tables. You MUST include if available, do NOT fabricate:
      - Current Metrics (price, date, market cap)
      - VNINDEX Baseline (current value, momentum)
      - Income Statement (revenue, profit with YoY%)
      - Balance Sheet (assets, liabilities, equity)
      - Profitability Ratios (ROE, ROA, margins)
      - Cash Flow (OCF, FCF)
      - Fundamental Ratios (P/E, P/B, EV/EBITDA)
      - Peer Comparison (top competitors)

    CRITICAL: Do NOT perform analysis or write qualitative summaries.
    Your job is ONLY to extract and organize the raw data facts.

    Save the complete output to `{financial_summary_path}`.
  expected_output: >
    A rigidly structured output matching the `BaselineMetrics` pydantic model fields.
    All fields must contain rich markdown tables with exact numbers. No prose or summaries.

forensic_annual_report_review:
  description: >
    Check annual report availability for `{stock_symbols}`, then run 4 standard GCCP forensic checks.

    Step 1: List files in `{annual_reports_dir}`. Find the `{stock_symbols}` annual report markdown file.
    Step 2: If NOT found, respond with `ANNUAL_REPORT_NOT_AVAILABLE` and stop immediately. Do not guess.
    Step 3: If found, read the full annual report markdown using your `read_file` tool.
    Step 4: Run the 4 standard forensic checks:
      1. Fake Revenue: Compare receivables growth vs revenue growth.
      2. Margin Squeeze: Look for declining gross/operating margins over time.
      3. Hidden Debt: Check for off-balance-sheet items, related party transactions, contingent liabilities.
      4. Inventory Bloat: Compare inventory growth vs COGS growth.
    Step 5: For each check, provide: Status (MENTIONED/NOT_MENTIONED), Short Quote (key text), Summary.
    Step 6: Report to manager with your finding.
    CRITICAL: You MUST ONLY read files from `{annual_reports_dir}`. Do NOT read sentiment data.
  expected_output: >
    Either `ANNUAL_REPORT_NOT_AVAILABLE` or a structured Q&A with all 4 forensic checks answered
    with Status, Short Quote (key text), and Summary for each.

compile_evaluation_report:
  description: >
    Synthesize all inputs into a structured GCCP evaluation report for `{stock_symbols}`.

    You are the Chief Orchestrator. Use the context from previous tasks and delegate additional work as needed.

    --- HANDLE FEEDBACK (if `{feedback}` is provided) ---
    Read the Director's rejection feedback, identify weaknesses cited, and address them.
    Delegate additional data extraction or forensic questions to subordinates if needed.

    --- STEP 1: READ ALL INPUTS ---
    - Read baseline metrics from `{financial_summary_path}` using delegation to Data Specialist.
    - Read ticker sentiment from `{ticker_sentiment_path}`.
    - Read market sentiment from `{sentiment_dir}`.
    - Receive forensic findings from the previous task context.

    --- STEP 2: CLASSIFY INDUSTRY DYNAMICS (GCCP Part II.1) ---
    Classify: Slow Growth / Sustainable / Fast Growth / Cyclical.

    --- STEP 3: EVALUATE GOOD COMPANY (Qualitative, GCCP Part II.2-3) ---
    - Business Model (Input → Engine → Output)
    - Management & Governance
    - Use ticker sentiment for recent news / management statements.
    - If you spot unclear numbers or claims, delegate follow-up questions to `Forensic Accounting and Document Analysis Specialist`.
    - GUARD: If forensic review returned `ANNUAL_REPORT_NOT_AVAILABLE`, do NOT delegate further annual report questions.

    --- STEP 4: EVALUATE GOOD COMPANY (Quantitative, GCCP Part III) ---
    - Capital Structure, Profitability (ROE>15%, ROA>6%), Cash Generation (OCF>NI, FCF>5%)
    - Incorporate forensic findings, flag anomalies.
    - Delegate specific forensic questions as they arise (same unavailability guard).

    --- STEP 5: DELEGATE VISUALIZATIONS (dynamic, based on findings) ---
    Based on Steps 2-4 findings, delegate SPECIFIC charts to `Data Specialist` that highlight key discoveries.
    Examples: "Draw a chart showing margin trends from 2022-2025" or "Show revenue vs receivables growth".
    Data Specialist saves charts to `{synthesizer_output_dir}/charts/` and returns markdown embed links.

    --- STEP 6: EVALUATE CHEAP PRICE (GCCP Part IV) ---
    Market Phase (Crisis/Fair/Bubble), Graham/Lynch criteria, Peer Comparison, Relative Valuation, Margin of Safety.

    --- STEP 7: TARGET PRICE & ACTIONABLE SUGGESTION (GCCP Part V) ---
    Calculate Fair Value → apply MoS → Suggested Buy Price.
    Actionable: "BUY NOW" / "WAIT FOR P/E TO DROP TO Xx" / "AVOID".

    --- STEP 8: COMPILE FINAL REPORT ---
    Embed chart images, use clickable inline markdown links for all citations.
    Output as `SynthesizerReport` JSON matching the Pydantic schema.

    CRITICAL CITATION RULE:
    Use CLICKABLE INLINE MARKDOWN LINKS for every financial number, ratio, and claim.
    You are STRICTLY FORBIDDEN from using plain text footnotes like `[^1]`.
  expected_output: >
    A highly structured report perfectly matching the `SynthesizerReport` format.
    CRITICAL: Output your entire response as a single, valid JSON object matching the `SynthesizerReport` schema.
    You MUST populate `current_metrics` using the precise current trading price, VNINDEX, and date.
    You MUST use explicit `[Link Text](URL)` markdown links for all citations.
    You MUST explicitly declare any quantitative anomalies.
    You MUST embed charts generated by the Data Specialist using their markdown image embed links.
    You MUST process the data section-by-section per GCCP framework.
    Do NOT provide an overall Pass/Fail for the stock.

    FINALLY, in your summary, you MUST:
    - Calculate a specific suggested buy price (Fair Value minus Required MoS).
    - Provide a clear `actionable_suggestion` (e.g. "BUY NOW", "WAIT FOR DIP TO X", "AVOID").
    - Provide explicit `critical_warnings` detailing what to wait for and what to be careful about.
  output_file: "{synthesizer_output_dir}/{stock_symbols}_GCCP_report_v{report_version}.md"
