detect_quantitative_anomalies:
  description: >
    Conduct a systematic risk review of the baseline financials for `{stock_symbols}`.

    Step 1: Use `FileReadTool` to read the full historical financials at `{financial_summary_path}`.
    Step 2: Methodically check for the quantitative red flags outlined in your backstory (Earnings Quality, Working Capital Bloat, Margin Compression, Debt Risks).
    Step 3: If you suspect a discrepancy (e.g., Receivables grew faster than Revenue) but need exact percentages, DELEGATE a calculation task to `data specialist`.
    Step 4: Compile a concise list of quantitative findings. Include exact numerical evidence from the financial summary.
    If no anomalies are found, explicitly state "No quantitative anomalies detected."
  expected_output: >
    A structured quantitative risk report detailing specific numerical red flags (Earnings Quality, Working Capital, Margins, Debt) with evidence and analysis.
  agent: quantitative_risk_analyst

forensic_annual_report_review:
  description: >
    Check annual report availability for `{stock_symbols}`, then use semantic search to run 5 qualitative narrative checks on the "Notes to Financial Statements" and Management Discussion blocks.

    Step 1: Use `DirectoryReadTool` on `{annual_reports_dir}` to find the exact path to the `{stock_symbols}` annual report `.md` file.
    Step 2: If NOT found, respond with `ANNUAL_REPORT_NOT_AVAILABLE` and stop immediately.
    Step 3: If found, use `MDXSearchTool` to search that specific file for the 5 narrative checks (Auditor Trust, Related Party Transactions, Off-Balance-Sheet Risks, Management Remuneration, Revenue Recognition Gimmicks).
    Step 4: Report findings back using the strict Response Format (Status, Quote, Summary). Keep your final answer concise.

    ⚠️ CRITICAL BOUNDARY RULE: Stop doing math. Do not compare inventory to COGS. Do not calculate margin squeeze. That belongs to the Quantitative Analyst. Focus ONLY on qualitative/legal forensic checks.
  expected_output: >
    A list of 5 qualitative forensic checks (Auditor Trust, Related Party, Off-Balance-Sheet, Management Remuneration, Revenue Recognition) with Status, Short Quote (key text), and Summary for each.
  agent: forensic_accountant

compile_evaluation_report:
  description: >
    Synthesize all inputs into a structured GCCP evaluation report for `{stock_symbols}`.
    You will receive data via context from previous tasks. DELEGATE **ONLY** new ad-hoc data queries and visualization queries to `data specialist`. DELEGATE any new annual report questions to `forensic accounting and document analysis specialist`. DELEGATE ad-hoc internet searches for macro events/recent news to `market research specialist` (maximum 5 delegations allowed).
    ⚠️ BASELINE AWARENESS: The full historical Income Statement, Balance Sheet, Cash Flow, and Key Ratios are ALREADY PRE-COMPILED and available directly via the `{financial_summary_path}` file.
    ⚠️ STRICT SCOPE RULE: You MUST rely EXCLUSIVELY on `{financial_summary_path}` for all financial statement numbers (Revenue, Income, Cashflow, Balance Sheet). Do NOT ask the forensic accountant to extract financial statements from the annual report. Do NOT ask the data specialist to refetch them.

    ⚠️ ANTI-HALLUCINATION RULE FOR current_metrics FIELD:
    Your `current_metrics` field MUST contain the EXACT price, date, and valuation ratios
    from the Data Specialist's Current Market Snapshot (the FetchCurrentMarketSnapshotTool output).
    Do NOT use values from your training data. Copy them verbatim.

    STEP 0: READ BASELINE & SENTIMENT
    Use your `FileReadTool` to read the market and ticker sentiment at `{ticker_sentiment_path}`.
    Use your `FileReadTool` to read the full historical Income Statement, Balance Sheet, Cash Flow, and Key Ratios at `{financial_summary_path}`.
    You MUST read this yourselves. Do NOT ask the data specialist to read or fetch this for you.

    STEP 1: CLASSIFY INDUSTRY DYNAMICS & LYNCH CATEGORY (GCCP Part II.1)
    Classify Industry: Slow Growth / Sustainable / Fast Growth / Cyclical.
    ⚠️ INDUSTRY RISKS & POTENTIALS: You MUST explicitly include a subsection for "Industry Risks & Potentials" that lists the specific industry headwinds (Downside risks / Rủi ro suy yếu) and tailwinds (Upside potentials / Động lực thúc đẩy) extracted from the `{ticker_sentiment_path}`. Look specifically for the "Macro Resilience", "Thesis Invalidation", and "Additional Crucial Findings" sections in the sentiment report. Do not use generic industry descriptions; extract the EXACT specific events, risks, and catalysts.
    Classify Lynch Category: Justify the choice explicitly based on the numbers.
    ⚠️ CLASSIFICATION RULE: You MUST strictly adhere to the numerical definitions in the knowledge base for your classifications. Explicitly provide a brief justification summarizing WHY you chose the Industry and Lynch classifications, considering the exact data metrics and sentiment context.

    STEP 2: EVALUATE GOOD COMPANY (Qualitative, GCCP Part II.2-3)
    - Business Model (Input → Engine → Output)
    - Management & Governance
    - Use ticker sentiment for recent news / management statements.
    - If you spot unclear numbers or claims, delegate follow-up questions to `forensic accounting and document analysis specialist`.
    - GUARD: If forensic review returned `ANNUAL_REPORT_NOT_AVAILABLE`, do NOT delegate further annual report questions.

    STEP 3: EVALUATE GOOD COMPANY (Quantitative, GCCP Part III)
    - IMPORTANT: Extract the exact anomaly warnings, Margins, and Cash Flow logic provided by the `CalculateFrameworkMetricsTool` results inside the baseline summary. DO NOT recalculate or hallucinate them.
    - INCLDUDE the specific red flags found by the `quantitative_risk_analyst` in their report regarding Earnings Quality, Working Capital, and Margin Squeezes.
    - Capital Structure, Profitability (ROE>15%, ROA>6%), Cash Generation (OCF>NI, FCF>5%)
    - Incorporate textual forensic findings, flag anomalies.
    - Delegate specific forensic questions as they arise (same unavailability guard).

    STEP 4: DELEGATE CALCULATIONS & VISUALIZATIONS (dynamic, based on findings)
    Based on Steps 1-3 findings, delegate SPECIFIC calculations and charts to `data specialist` that highlight key discoveries.
    For any numerical calculation (CAGR, growth rates, custom ratios, comparisons), delegate to `data specialist` who will execute precise Python code. Do NOT perform arithmetic yourself — LLMs are unreliable at math.
    Examples: "Calculate 5-year revenue CAGR from the financial summary" or "Draw a chart showing margin trends from 2022-2025" or "Show revenue vs receivables growth".
    Data Specialist saves charts to `{synthesizer_output_dir}/charts/` and returns markdown embed links.

    STEP 5: EVALUATE CHEAP PRICE (GCCP Part IV)
    Market Phase (Crisis/Fair/Bubble), Graham/Lynch criteria, Margin of Safety.

    ⚠️ MARKET PHASE RULE: The VNINDEX P/E and P/B ratios are provided by the FetchCurrentMarketSnapshotTool output inside `{financial_summary_path}`. Use these concrete values to classify the Market Phase:
    - Crisis: VNINDEX P/E < 10
    - Fair: VNINDEX P/E 10-17
    - Bubble: VNINDEX P/E > 17
    Do NOT guess or hallucinate the VNINDEX valuation. Copy the exact P/E and P/B values from the Market Index section.

    ⚠️ GRAHAM CHECKLIST RULE:
    The complete 9-point Graham Defensive Criteria checklist has ALREADY been deterministically computed and is available in your `{financial_summary_path}` under "3. Graham Defensive Criteria (9-Point Checklist)".
    You MUST copy the exact numbered Pass/Fail results from that file into your report. Do NOT attempt to calculate the 10-year historical metrics or these 9 criteria yourself using raw data.

    ⚠️ VALUATION METHODOLOGY MAPPING:
    You MUST strictly map your valuation narrative to your STEP 1 classification:
    - If classified as 'Defensive' (Slow/Sustainable Growth), focus heavily on Asset value, Dividend Yield, and the Graham Checklist.
    - If classified as 'Fast Grower', explicitly rely on Lynch PEG metrics and the Effective CAGR (or Net Profit CAGR if instructed).
    - If classified as 'Cyclical', focus on P/B ratio and historical cycle timing.
    Do not use PEG for Defensive stocks, and do not rely entirely on P/E for Cyclicals.

    ⚠️ PEER COMPARISON RULE (DISABLED):
    Do NOT perform any peer comparisons or relative valuations. The peer comparison framework is currently disabled. Ignore any peer data.

    STEP 6: TARGET PRICE & ACTIONABLE SUGGESTION (GCCP Part V)
    Calculate Fair Value → apply MoS → Suggested Buy Price.
    Actionable: "BUY NOW" / "WAIT FOR P/E TO DROP TO Xx" / "AVOID".

    ⚠️ TARGET PRICE CALCULATION RULE (TRANSPARENCY):
    You MUST include a dedicated "### Valuation Math" block in your Markdown report.
    This block MUST document step-by-step how the target price was derived, showing:
    1. Your chosen Fair Value multiple (e.g. Fair P/E)
    2. The EPS used
    3. The Required Margin of Safety %
    4. The delegated final target price result computed by the Data Specialist. Do NOT perform arithmetic yourself.

    STEP 7: COMPILE FINAL REPORT
    Embed chart images and compile all sections into the final output.
    You MUST include a dedicated subsection titled **"Sentiment & Market Psychology"** explaining the market sentiment explicitly.
    You MUST begin your `report_markdown` with a catchy one-line hook (in italics) that summarizes the investment thesis in plain language. Examples: *"Công ty tốt, giá chưa hấp dẫn — chờ điểm mua vào tốt hơn"* or *"Tăng trưởng mạnh, định giá hợp lý — cơ hội đầu tư dài hạn"*. This hook should be the very first line of report_markdown, before any headings.
  expected_output: >
    A single, valid JSON object matching the `SynthesizerReport` Pydantic schema.
    All fields must be populated. Include in your summary:
    - Explicit citations to `[Financial Summary]({financial_summary_path})` for quantitative claims.
    - A specific suggested buy price (Fair Value minus Required MoS).
    - A clear `actionable_suggestion` (e.g. "BUY NOW", "WAIT FOR DIP TO X", "AVOID").
    - Explicit `critical_warnings` detailing what to wait for and what to be careful about.
    - The `current_metrics` field MUST exactly match the snapshot from FetchCurrentMarketSnapshotTool.
  output_file: "{synthesizer_output_dir}/{stock_symbols}_GCCP_report_v{report_version}.md"
  agent: synthesizer_manager

evaluate_feedback:
  description: >
    The Director has REJECTED the previous version of the GCCP report for `{stock_symbols}`.
    Your job is a TARGETED REVISION, not a full rewrite.

    STEP 1: Use your `FileReadTool` to read the previous report version from `{synthesizer_output_dir}`.
    Read the full content yourself. Do NOT delegate this step.

    STEP 2: Use your `FileReadTool` to read the Director's review at: `{feedback}`
    Read the full content yourself. Do NOT delegate this step.

    STEP 3: EXTRACT the specific weaknesses and deficiencies the Director cited.

    STEP 4: For EACH cited weakness, decide:
      - If it requires DOCUMENT EVIDENCE → delegate to `forensic accounting and document analysis specialist`.
      - If it requires REWRITING or REANALYSIS → revise that section yourself using the existing context.
      - If you requires more metrics or data that is not in financial summary → delegate to `data specialist` to calculate this.
      - If it requires more DATA that is not available after running ALL other tools → use 'Brave Search for Market Context' and perform search.
    ⚠️ CRITICAL: Only allowed 3 searches in total for each revision.

    STEP 5: REBUILD the full report: keep approved sections intact, fix only the weak sections.
    ⚠️ CRITICAL RETENTION RULE: You MUST retain all previously generated sections exactly as they were, especially the "Industry Risks & Potentials" subsection and the "Actionable Suggestion" format. Do not drop or summarize previously approved sections.
    ⚠️ CHART RETENTION RULE: You MUST preserve ALL chart image markdown embeds (![...](path.png)) from the previous report version. Copy them exactly as-is into the revised report_markdown. Do NOT drop chart references when revising.

    STEP 6: Populate the `revision_notes` field with a detailed summary stating:
      - Which weaknesses were addressed
      - What new data or evidence was gathered
      - What remains as a known limitation
    Do NOT include `revision_notes` inside your `report_markdown` string. Populate it in its dedicated field!

    WARNING: Do NOT re-run baseline data extraction or forensic standard checks unless
    the Director feedback explicitly demands it.
    CRITICAL WARNING: If the Director requires new financial metrics or data extraction from the Data Specialist, you MUST explicitly instruct the Data Specialist to use the `append_to_file` tool to APPEND this new data to `{financial_summary_path}`. You are STRICTLY FORBIDDEN from overwriting or destroying the original baseline financial summary file.
  expected_output: >
    A single, valid JSON object matching the exactly simplified `SynthesizerReport` Pydantic schema.
    Your `report_markdown` string field MUST contain the FULL, beautifully formatted markdown
    matching the multi-part structure (Part I to Part VI).
    All boolean fields must be accurately populated.
    Include a `Revision Notes` sub-section within the `summary_of_findings` or markdown text.
  output_file: "{synthesizer_output_dir}/{stock_symbols}_GCCP_report_v{report_version}.md"
  agent: synthesizer_manager
