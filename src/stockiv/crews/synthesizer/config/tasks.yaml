detect_quantitative_anomalies:
  description: >
    Conduct a systematic risk review of the baseline financials for `{stock_symbols}`.

    Step 1: Use `FileReadTool` to read the full historical financials at `{financial_summary_path}`.
    Step 2: Methodically check for the quantitative red flags outlined in your backstory (Earnings Quality, Working Capital Bloat, Margin Compression, Debt Risks).
    Step 3: If you suspect a discrepancy (e.g., Receivables grew faster than Revenue) but need exact percentages, DELEGATE a calculation task to `data specialist`.
    Step 4: Compile a concise list of quantitative findings. Include exact numerical evidence from the financial summary.
    If no anomalies are found, explicitly state "No quantitative anomalies detected."
  expected_output: >
    A structured quantitative risk report detailing specific numerical red flags (Earnings Quality, Working Capital, Margins, Debt) with evidence and analysis.
  agent: quantitative_risk_analyst

forensic_annual_report_review:
  description: >
    Check annual report availability for `{stock_symbols}`, then use semantic search to run 5 qualitative narrative checks on the "Notes to Financial Statements" and Management Discussion blocks.

    Step 1: Use `DirectoryReadTool` on `{annual_reports_dir}` to find the exact path to the `{stock_symbols}` annual report `.md` file.
    Step 2: If NOT found, respond with `ANNUAL_REPORT_NOT_AVAILABLE` and stop immediately.
    Step 3: If found, use `MDXSearchTool` to search that specific file for the 5 narrative checks (Auditor Trust, Related Party Transactions, Off-Balance-Sheet Risks, Management Remuneration, Revenue Recognition Gimmicks).
    Step 4: Report findings back using the strict Response Format (Status, Quote, Summary). Keep your final answer concise.

    ⚠️ CRITICAL BOUNDARY RULE: Stop doing math. Do not compare inventory to COGS. Do not calculate margin squeeze. That belongs to the Quantitative Analyst. Focus ONLY on qualitative/legal forensic checks.
  expected_output: >
    A list of 5 qualitative forensic checks (Auditor Trust, Related Party, Off-Balance-Sheet, Management Remuneration, Revenue Recognition) with Status, Short Quote (key text), and Summary for each.
  agent: forensic_accountant

evaluate_qualitative_goodness:
  description: >
    Evaluate the QUALITATIVE "Good Company" dimensions for `{stock_symbols}` (GCCP Part II).

    STEP 0: READ BASELINE & SENTIMENT
    Use your `FileReadTool` to read the market and ticker sentiment at `{ticker_sentiment_path}`.
    Use your `FileReadTool` to read the full historical financials at `{financial_summary_path}`.
    You MUST read these yourself. Do NOT ask the data specialist to read or fetch this for you.

    STEP 1: CLASSIFY INDUSTRY DYNAMICS & LYNCH CATEGORY (GCCP Part II.1)
    Classify Industry: Slow Growth / Sustainable / Fast Growth / Cyclical.
    ⚠️ INDUSTRY RISKS & POTENTIALS: You MUST explicitly include a subsection for "Industry Risks & Potentials" that lists the specific industry headwinds (Downside risks / Rủi ro suy yếu) and tailwinds (Upside potentials / Động lực thúc đẩy) extracted from the `{ticker_sentiment_path}`. Look specifically for the "Macro Resilience", "Thesis Invalidation", and "Additional Crucial Findings" sections in the sentiment report. Do not use generic industry descriptions; extract the EXACT specific events, risks, and catalysts.
    Classify Lynch Category: Justify the choice explicitly based on the numbers.
    ⚠️ CLASSIFICATION RULE: You MUST strictly adhere to the numerical definitions in the knowledge base for your classifications. Explicitly provide a brief justification summarizing WHY you chose the Industry and Lynch classifications, considering the exact data metrics and sentiment context.

    STEP 2: EVALUATE GOOD COMPANY (Qualitative, GCCP Part II.2-3)
    - Business Model (Input → Engine → Output)
    - Management & Governance
    - Use ticker sentiment for recent news / management statements.
    - If you spot unclear numbers or claims, delegate follow-up questions to `forensic accounting and document analysis specialist`.
    - GUARD: If forensic review returned `ANNUAL_REPORT_NOT_AVAILABLE`, do NOT delegate further annual report questions.

    ⚠️ INDUSTRY CLASSIFICATION KNOWLEDGE BASE:
    {industry_guides}
  expected_output: >
    A structured evaluation covering:
    1. Industry classification (Slow/Sustainable/Fast/Cyclical) with justification
    2. Lynch category with justification
    3. Industry Risks & Potentials (specific events, not generic)
    4. Business Model analysis (Input → Engine → Output)
    5. Management & Governance assessment
    Include a dedicated "Sentiment & Market Psychology" section with SPECIFIC findings and original URL citations from the sentiment report.
  agent: synthesizer_manager

evaluate_quantitative_goodness:
  description: >
    Evaluate the QUANTITATIVE "Good Company" dimensions for `{stock_symbols}` (GCCP Part III).
    You will receive upstream context from the qualitative evaluation. Build upon it.

    ⚠️ BASELINE AWARENESS: The full historical financials are at `{financial_summary_path}`. Use `FileReadTool` if you need to re-check specific numbers.

    STEP 1: FINANCIAL HEALTH ASSESSMENT
    - IMPORTANT: Extract the exact anomaly warnings, Margins, and Cash Flow logic provided by the `CalculateFrameworkMetricsTool` results inside the baseline summary. DO NOT recalculate or hallucinate them.
    - INCLUDE the specific red flags found by the `quantitative_risk_analyst` in their earlier report regarding Earnings Quality, Working Capital, and Margin Squeezes.
    - Capital Structure, Profitability (ROE>15%, ROA>6%), Cash Generation (OCF>NI, FCF>5%)
    - Incorporate textual forensic findings from upstream context, flag anomalies.

    STEP 2: DELEGATE CALCULATIONS & VISUALIZATIONS
    Based on findings, delegate SPECIFIC calculations and charts to `data specialist` that highlight key discoveries.
    For any numerical calculation (CAGR, growth rates, custom ratios, comparisons), delegate to `data specialist` who will execute precise Python code. Do NOT perform arithmetic yourself — LLMs are unreliable at math.
    Examples: "Calculate 5-year revenue CAGR from the financial summary" or "Draw a chart showing margin trends from 2022-2025" or "Show revenue vs receivables growth".
    Data Specialist saves charts to `{synthesizer_output_dir}/charts/` and returns markdown embed links.

    ⚠️ FINANCIAL ANALYSIS KNOWLEDGE BASE:
    {financial_reading_guide}
  expected_output: >
    A structured quantitative evaluation covering:
    1. Capital Structure assessment
    2. Profitability metrics (ROE, ROA, margins) with Pass/Fail verdicts
    3. Cash Generation assessment (OCF vs NI, FCF yield)
    4. Quantitative anomaly red flags (from risk analyst + own findings)
    5. Charts/visualizations embedded with markdown links
    All claims MUST cite `[Financial Summary]({financial_summary_path})`.
  agent: synthesizer_manager

evaluate_cheap_price:
  description: >
    Evaluate the "Cheap Price" dimension for `{stock_symbols}` (GCCP Part IV-V).
    You will receive upstream context from both qualitative and quantitative evaluations.

    ⚠️ ANTI-HALLUCINATION RULE FOR current_metrics:
    Your `current_metrics` values MUST contain the EXACT price, date, and valuation ratios
    from the Data Specialist's Current Market Snapshot (the FetchCurrentMarketSnapshotTool output in `{financial_summary_path}`).
    Do NOT use values from your training data. Copy them verbatim.

    STEP 1: EVALUATE CHEAP PRICE (GCCP Part IV)
    Market Phase (Crisis/Fair/Bubble), Graham/Lynch criteria, Margin of Safety.

    ⚠️ MARKET PHASE RULE: The VNINDEX P/E and P/B ratios are provided by the FetchCurrentMarketSnapshotTool output inside `{financial_summary_path}`. Use these concrete values to classify the Market Phase:
    - Crisis: VNINDEX P/E < 10
    - Fair: VNINDEX P/E 10-17
    - Bubble: VNINDEX P/E > 17
    Do NOT guess or hallucinate the VNINDEX valuation. Copy the exact P/E and P/B values from the Market Index section.

    ⚠️ GRAHAM CHECKLIST RULE:
    The complete 9-point Graham Defensive Criteria checklist has ALREADY been deterministically computed and is available in your `{financial_summary_path}` under "3. Graham Defensive Criteria (9-Point Checklist)".
    You MUST copy the exact numbered Pass/Fail results from that file into your report. Do NOT attempt to calculate the 10-year historical metrics or these 9 criteria yourself using raw data. If 10-year historical data is missing from the baseline, use "N/A" and mark it as a Fail. Under NO circumstances should you hallucinate data from older years (e.g., 2015) to fill in missing information.

    ⚠️ VALUATION METHODOLOGY MAPPING:
    You MUST strictly map your valuation narrative to your STEP 1 classification from upstream context:
    - If classified as 'Defensive' (Slow/Sustainable Growth), focus heavily on Asset value, Dividend Yield, and the Graham Checklist.
    - If classified as 'Fast Grower', explicitly rely on Lynch PEG metrics and the Effective CAGR (or Net Profit CAGR if instructed).
    - If classified as 'Cyclical', focus on P/B ratio and historical cycle timing.
    Do not use PEG for Defensive stocks, and do not rely entirely on P/E for Cyclicals.
    ⚠️ GROWTH RATE RULE FOR THE VIETNAMESE MARKET:
    Vietnamese companies frequently issue stock dividends, which artificially deflates EPS growth calculations. You MUST use **Net Profit CAGR** instead of EPS CAGR for all growth rate evaluations, classifications, and PEG ratio calculations. Explicitly state that you are using Net Profit CAGR in your report.

    ⚠️ PEER COMPARISON RULE (DISABLED):
    Do NOT perform any peer comparisons or relative valuations. The peer comparison framework is currently disabled. Ignore any peer data.

    STEP 2: TARGET PRICE & ACTIONABLE SUGGESTION (GCCP Part V)
    Calculate Fair Value → apply MoS → Suggested Buy Price.
    Actionable: "BUY NOW" / "WAIT FOR P/E TO DROP TO Xx" / "AVOID".

    ⚠️ TARGET PRICE CALCULATION RULE (TRANSPARENCY):
    You MUST include a dedicated "### Valuation Math" block in your output.
    This block MUST document step-by-step how the target price was derived, showing:
    1. Your chosen Fair Value multiple (e.g. Fair P/E)
    2. The EPS used
    3. The Required Margin of Safety %
    4. The delegated final target price result computed by the Data Specialist. Do NOT perform arithmetic yourself.

    ⚠️ TARGET PRICE LOGIC SANITY CHECK:
    In our framework, "Target Price" means the MAXIMUM BUY PRICE (Fair Value minus Margin of Safety).
    It is the price you are willing to pay. It is NOT a price target for the stock to reach.
    - If Current Price **<** Target Buy Price → the stock is trading BELOW your buy threshold → **BUY NOW**.
      Example: Current 77,000 VND, Target Buy Price 99,884 VND → BUY NOW (you can buy cheaper than your threshold).
    - If Current Price **>** Target Buy Price → the stock is trading ABOVE your buy threshold → **WAIT** for it to drop.
      Example: Current 77,000 VND, Target Buy Price 67,000 VND → WAIT FOR DIP (it's too expensive vs your threshold).
    DO NOT invert this logic. This is the most common error.
    After calculating the target price, ALWAYS compare it to the current price and apply the rule above BEFORE writing your recommendation.

    ⚠️ VALUATION CRITERIA KNOWLEDGE BASE:
    {criteria}

    ⚠️ MARKET CONTEXT KNOWLEDGE BASE:
    {market_context}
  expected_output: >
    A structured valuation evaluation covering:
    1. Market Phase classification (Crisis/Fair/Bubble) with exact VNINDEX P/E and P/B values
    2. Graham 9-Point Checklist results (copied from financial summary)
    3. Lynch PEG / Valuation methodology mapped to the upstream classification
    4. Valuation Math block with step-by-step target price derivation
    5. Actionable suggestion (BUY NOW / WAIT / AVOID) with target price
    6. current_metrics (exact values from FetchCurrentMarketSnapshotTool)
    All claims MUST cite `[Financial Summary]({financial_summary_path})`.
  agent: synthesizer_manager

compile_final_report:
  description: >
    Compile ALL upstream evaluation outputs into a single structured GCCP report for `{stock_symbols}`.
    You have the full qualitative, quantitative, and valuation evaluations from previous tasks in your context.

    YOUR JOB IS COMPILATION, NOT RE-ANALYSIS.
    Do NOT redo evaluations or recalculate anything. Assemble the upstream outputs into the final JSON.

    COMPILATION RULES:
    1. You MUST begin `report_markdown` with a catchy one-line hook (in italics) that summarizes the investment thesis in plain language. Examples: *"Công ty tốt, giá chưa hấp dẫn — chờ điểm mua vào tốt hơn"* or *"Tăng trưởng mạnh, định giá hợp lý — cơ hội đầu tư dài hạn"*. This hook should be the very first line of report_markdown, before any headings.
    2. You MUST include a dedicated subsection titled **"Sentiment & Market Psychology"** as one of the FIRST sections of your report (right after the introductory hook).
    ⚠️ SENTIMENT EMBEDDING RULE: This section must NOT be a generic summary. You MUST embed the SPECIFIC findings, catalyst descriptions, and **original URL citations** (e.g., `[[1]](https://...)`) directly from the upstream qualitative evaluation. Copy the source URLs and reference numbers exactly as they appear in the sentiment report. Include specific details like company names, patent references, market events, and strategic initiatives mentioned in the sentiment report.
    3. You MUST also embed the specific "Industry Risks & Potentials" (Downside Risks / Upside Potentials) and "Thesis Invalidation" triggers from the upstream qualitative evaluation, preserving the original citation URLs.
    4. Embed all chart images from upstream context using their markdown embed links.
    5. You MUST populate the `financial_summary_path` field with the exact `{financial_summary_path}` string.
    6. You MUST populate `current_metrics` with the precise values from the upstream cheap price evaluation.

    📦 OUTPUT FORMAT:
    Your final output MUST be a single, valid JSON object matching the `SynthesizerReport` Pydantic schema.

    CRITICAL: Your JSON output MUST explicitly follow this flat schema:
    {synthesizer_report_schema}
  expected_output: >
    A single, valid JSON object matching the `SynthesizerReport` Pydantic schema.
    All fields must be populated. Include in your summary:
    - Explicit citations to `[Financial Summary]({financial_summary_path})` for quantitative claims.
    - A specific suggested buy price (Fair Value minus Required MoS).
    - A clear `actionable_suggestion` (e.g. "BUY NOW", "WAIT FOR DIP TO X", "AVOID").
    - Explicit `critical_warnings` detailing what to wait for and what to be careful about.
    - The `current_metrics` field MUST exactly match the snapshot from FetchCurrentMarketSnapshotTool.
  output_file: "{synthesizer_output_dir}/{stock_symbols}_GCCP_report_v{report_version}.md"
  agent: synthesizer_manager

evaluate_feedback:
  description: >
    The Director has REJECTED the previous version of the GCCP report for `{stock_symbols}`.
    Your job is a TARGETED PATCH — surgically fix ONLY the sections the Director flagged. This is NOT a rewrite.

    ⚠️⚠️⚠️ SUPREME RULE — PRESERVATION OVER PERFECTION ⚠️⚠️⚠️
    The previous report contains sections that PASSED the Director's review. Those sections are SACRED.
    You MUST copy them character-for-character into the revised report. This includes:
    - ALL section headings and their content (e.g., "Sentiment & Market Psychology", "Critical Warnings", "Industry Risks & Potentials")
    - ALL chart markdown embeds (![...](path.png)) — copy them EXACTLY as-is
    - ALL inline citations and source links
    - The overall document STRUCTURE and heading hierarchy from the previous version
    If a section was NOT mentioned in the Director's failures, it MUST appear identically in the new version.
    Dropping, summarizing, or restructuring approved sections is a CRITICAL FAILURE.

    STEP 1: The FULL text of the previous report version has been PRE-INJECTED below (between the ========== markers).
    This is your BASE DOCUMENT. You do NOT need to use FileReadTool to read it — it is already in your context.
    Treat every line of this base document as your starting point.

    STEP 2: Use your `FileReadTool` to read the Director's review at: `{feedback}`
    Read the full content yourself. Do NOT delegate this step.

    STEP 3: DIFF PLANNING — Before making ANY changes, you MUST explicitly list:
      a) Which specific sections/paragraphs the Director flagged as failures.
      b) For EACH flagged section, what the fix requires (new data, recalculation, rewrite).
      c) Which sections are APPROVED and will be copied verbatim. This list should be the majority of the report.
    This plan is for your internal reasoning. Execute the plan in the following steps.

    STEP 4: For EACH cited weakness, decide:
      - If it requires DOCUMENT EVIDENCE → delegate to `forensic accounting and document analysis specialist`.
      - If it requires RECALCULATION or NEW METRICS → delegate to `data specialist`. Do NOT perform arithmetic yourself.
      - If it requires REWRITING or REANALYSIS → revise ONLY that section yourself using the existing context.
      - If it requires more DATA that is not available after running ALL other tools → use 'Brave Search for Market Context' and perform search.
    ⚠️ CRITICAL: Only allowed 3 searches in total for each revision.

    STEP 5: PATCH the report. Start from the EXACT text of the previous report as your base.
    Replace ONLY the specific paragraphs or values that address the Director's failures.
    Every section that was NOT flagged by the Director MUST remain IDENTICAL to the previous version.
    Do NOT change the heading structure, section order, or formatting style of the previous report.

    STEP 6: Populate the `revision_notes` field with a detailed summary stating:
      - Which weaknesses were addressed and how
      - What new data or evidence was gathered
      - What remains as a known limitation
    Do NOT include `revision_notes` inside your `report_markdown` string. Populate it in its dedicated field!

    WARNING: Do NOT re-run baseline data extraction or forensic standard checks unless
    the Director feedback explicitly demands it.
    CRITICAL WARNING: If the Director requires new financial metrics or data extraction from the Data Specialist, you MUST explicitly instruct the Data Specialist to use the `append_to_file` tool to APPEND this new data to `{financial_summary_path}`. You are STRICTLY FORBIDDEN from overwriting or destroying the original baseline financial summary file.
  expected_output: >
    A single, valid JSON object matching the exactly simplified `SynthesizerReport` Pydantic schema.
    Your `report_markdown` string field MUST contain the FULL report with the SAME structure
    and formatting as the previous version. Only the Director-flagged sections should differ.
    All boolean fields must be accurately populated.
    The `revision_notes` field must describe exactly what changed and why.
  output_file: "{synthesizer_output_dir}/{stock_symbols}_GCCP_report_v{report_version}.md"
  agent: synthesizer_manager
