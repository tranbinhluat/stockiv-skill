version: '3.8'

services:
  stockiv-api:
    build: .
    container_name: stockiv_crewai_api
    ports:
      - "8000:8000"
    volumes:
      # Mount the data directory so context files generated by the Collector are accessible
      - ./data:/app/data
      - ./src:/app/src
      - ./tools:/app/tools
      - ./logs:/app/logs
      # Mount memory if you want chromadb long term memory to persist across container restarts
      - ./knowledge:/app/knowledge
      - ./.crewai:/app/.crewai
    environment:
      # Add necessary API keys here that the Crew might need
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - CREWAI_TRACING_ENABLED=true
    restart: unless-stopped
    networks:
      - n8n-net

networks:
  n8n-net:
    # If the user's n8n docker stack already has a network, we attach it here for seamless internal DNS
    # Replace 'n8n_default' with your actual n8n network name if different
    name: n8n_default
    external: true
