[project]
name = "stockiv"
version = "0.1.0"
description = "Stock analysis with AI agents"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic,google-genai]>=1.10",
    "crewai-tools>=1.10",
    "python-dotenv>=1.0.0",
    "zhipuai>=1.0.7",
    "pypandoc>=1.16.2",
    "pytz>=2026.1.post1",
    "vnstock==0.2.8.5",
    "ipython>=9.10.0",
    "plotly>=6.6.0",
    "langchain-core>=1.2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockiv"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
stockiv-run = "stockiv:main"
