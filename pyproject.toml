[project]
name = "stockiv"
version = "0.1.0"
description = "Stock analysis with AI agents"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pytz>=2026.1.post1",
    "vnstock>=4.0.5",
    "plotly>=6.6.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pandas>=1.4.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.8",
    "pymupdf4llm>=0.2.9",
    "pillow>=12.1.1",
    "markdown>=3.10.2",
    "weasyprint>=68.1",
    "pyrootutils>=1.0.4",
    "requests>=2.32.5",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockiv"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
]

[project.scripts]
stockiv-run = "stockiv.main:kickoff"
stockiv-collect = "stockiv.cli:collect"
stockiv-report = "stockiv.cli:report"
stockiv-publish = "stockiv.cli:publish"
stockiv-scout = "stockiv.cli:scout"

[tool.ruff]
exclude = [
    ".agents/",
    "scripts/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
