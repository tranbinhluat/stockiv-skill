[project]
name = "stockiv"
version = "0.1.0"
description = "Stock analysis with AI agents"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic,google-genai,tools]>=1.10",
    "crewai-tools>=1.10",
    "python-dotenv>=1.0.0",
    "pytz>=2026.1.post1",
    "vnstock==3.4.2",
    "plotly>=6.6.0",                 # AUDIT: no direct imports — agents may use via execute_python_code
    "langchain-core>=1.2.17",        # AUDIT: no direct imports — likely transitive dep of crewai
    "litellm>=1.82.0",
    "sentence-transformers>=5.2.3",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.8",
    "pysqlite3>=0.6.0",              # AUDIT: no direct imports — may be needed by chromadb
    "sqlalchemy>=2.0.48",            # AUDIT: no direct imports — may be transitive dep
    "pymupdf4llm>=0.2.9",
    "pillow>=12.1.1",
    "setuptools<70",
    "langtrace-python-sdk>=3.8.21",
    "markdown>=3.10.2",
    "weasyprint>=68.1",
    "pyrootutils>=1.0.4",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockiv"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
stockiv-run = "stockiv:main"
