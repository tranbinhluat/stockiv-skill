[project]
name = "crewai-project"
version = "0.1.0"
description = "CrewAI project - AI agent orchestration framework"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.9.3",
    "crewai-tools>=1.9.3",
    "python-dotenv>=1.0.0",
    "zhipuai>=1.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_project"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
crewai-run = "crewai_project:main"
