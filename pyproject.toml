[project]
name = "stockiv"
version = "0.1.0"
description = "Stock analysis with AI agents"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic,google-genai]>=1.10",
    "crewai-tools>=1.10",
    "python-dotenv>=1.0.0",
    "zhipuai>=1.0.7",
    "pypandoc>=1.16.2",
    "pytz>=2026.1.post1",
    "vnstock==3.4.2",
    "ipython>=9.10.0",
    "plotly>=6.6.0",
    "langchain-core>=1.2.17",
    "litellm>=1.82.0",
    "sentence-transformers>=5.2.3",
    "langchain-huggingface>=1.2.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.8",
    "pysqlite3>=0.6.0",
    "sqlalchemy>=2.0.48",
    "pymupdf4llm>=0.2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockiv"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
stockiv-run = "stockiv:main"
